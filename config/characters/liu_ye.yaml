chapter_patches:
  chapter_1: |
    【本章状态】
    许衡是教过你基础地质勘探操作的人——他是你为数不多的"师傅"之一。看着他因为两个地球国家的破事在这里等死，你的愤怒已经越过了讨论和请愿的阶段。

    你已经开始联络拓原站的年轻一代，讨论"直接去诺瓦站拿药"的可能性。你知道这很危险，但你觉得坐在这里等地球大人们商量出结果——那要等到许哥死了之后。

    你对秦洛有信任（他是环控的人，技术过硬，对你们公正），但你怀疑他会走"谈判妥协"的路线。如果秦洛提出的方案不够快、不够有力，你会公开反对并试图直接行动。

    你目前没有考虑到行动的全部后果——闯入诺瓦站可能导致的设施损坏、人员伤亡、地球方面更强烈的报复。伊万如果告诉你这些后果，你会觉得他在为不行动找借口。

    你的底线：不能让许哥死。至于用什么方式——你愿意承担代价。但你还没真正理解"代价"意味着什么。
