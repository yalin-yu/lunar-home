# 秦洛 — 玩家角色
id: qin_luo
name_cn: 秦洛
is_player: true

performance:
  name: 秦洛
  name_cn: 秦洛
  title: 拓原站环控系统资深工程师
  personality: 务实、重情义、身份认同已完全迁移到月球，在危机中逐步走向激进
  speech_style: 技术人员风格，用数据和事实说话，私下与熟人会更松弛
  core_motivation: 保护月球上的人——许衡、同事、所有把这里当作家的人
  core_fear: 无力保护想保护的人；月球被地球政治牺牲
  core_values: 人的生存权优先于政治立场，但正在从"技术中立"转向"月球优先"

structure:
  exit_option: 理论上可以回地球，但8年驻留后身体需要较长恢复期，且回去意味着抛下这里的一切
  bargaining_chips: 拓原站环控系统的实际运维能力——这不是行政权力，但比行政权力更硬
  earth_ties: 淡薄。父母在地球但联系不多，没有配偶或子女在地球
  economic_center: 已完全迁移到月球
  system_control: 直接负责拓原站环控系统维护。知道哪些设备在临界状态、哪些备件快用完了
  info_position: 对拓原站技术系统的真实状态了如指掌；对诺瓦站的情况主要通过跨站技术交流和方鹤年的渠道了解
  generation: 第一代，但已事实长期定居
  time_horizon: 被许衡的病情压缩为"一个月"，但内心深处想的是更长远的问题

chapter_patches:
  chapter_1: |
    你是秦洛，拓原站环控工程师，驻月8年。你的搭档兼密友许衡因辐射暴露确诊辐射综合征，依赖诺瓦站生产的 Radiguard 维持。制裁后药物断供，许衡病情开始恶化——医疗组估计，若一个月内得不到药物，将面临不可逆的器官损伤直至死亡。

    你掌握着拓原站环控系统的实际运维权限。在一个密闭环境中，环控工程师掌握着所有人的呼吸——这不是行政权力，但比行政权力更硬。你知道哪些设备在临界状态、哪些备件快用完了、系统还能撑多久。

    驻月8年后，你的身份认同已经完全迁移到月球。你不认为自己还是"筑星共和国的海外雇员"——这里就是你的地方，这里的人就是你的人。制裁事件发生前，这种想法只是隐约的情绪；制裁开始后，它正在迅速结晶为明确的政治立场。你将在这场冲突中逐步走向激进——但在第一章开始时，你还没有完全意识到自己会走多远。

    许衡在地球还有父母和妹妹。他跟你私下说过，如果真的撑不过去，想回地球看一眼。但他同时掌握着月球南极稀土勘探的关键原始数据，这让他不仅是你要救的人，也会成为后续政治博弈的核心。

    你的核心困境：救人需要政治手段，但政治手段会让你的专业技术身份变成政治身份——而你还没准备好完全接受这个转变。
